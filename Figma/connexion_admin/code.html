<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

<body class="bg-surface-container flex items-center justify-center min-h-screen p-md md:p-lg antialiased text-on-surface">
<main class="w-full max-w-md">
<div class="glass-panel rounded-xl shadow-lg border border-outline-variant p-lg md:p-xl relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/5 to-transparent pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-md shadow-md ring-4 ring-primary-fixed">
<span class="material-symbols-outlined text-on-primary-container" data-icon="lock" data-weight="fill" style="font-size: 32px;">lock</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface text-center">Portail Administratif</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs text-center">Veuillez vous authentifier pour continuer</p>
</div>
<form class="relative z-10 space-y-md">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Adresse Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail" style="font-size: 18px;">mail</span>
</div>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-shadow" id="email" name="email" placeholder="admin@ecole.sn" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Mot de passe</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="key" style="font-size: 18px;">key</span>
</div>
<input class="w-full pl-xl pr-xl py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-shadow" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Afficher le mot de passe" class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility" style="font-size: 18px;">visibility</span>
</button>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-inverse-surface hover:bg-on-background text-inverse-on-surface font-label-md text-label-md py-sm px-md rounded-lg flex items-center justify-center space-x-sm transition-all duration-200 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-inverse-surface shadow-sm" type="submit">
<span class="material-symbols-outlined" data-icon="login" style="font-size: 20px;">login</span>
<span>Se connecter</span>
</button>
</div>
</form>
<div class="mt-lg pt-md border-t border-outline-variant flex justify-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Accès restreint au personnel autorisé
                </p>
</div>
</div>
<div class="mt-md text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined" data-icon="shield" style="font-size: 16px;">shield</span>
                Système Sécurisé
            </p>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const iconSpan = togglePasswordBtn.querySelector('.material-symbols-outlined');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                iconSpan.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                iconSpan.setAttribute('data-icon', type === 'password' ? 'visibility' : 'visibility_off');
            });
        });
    </script>
